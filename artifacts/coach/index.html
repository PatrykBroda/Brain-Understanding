    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is FRAME?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "FRAME is an AI combat-sports coach that builds a structured, evidence-based model of you as an athlete. It observes how you move and think under pressure — through conversation, video analysis and daily check-ins — and coaches you with precision that is earned over time, not assumed."
          }
        },
        {
          "@type": "Question",
          "name": "Which combat sports does FRAME support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "MMA, boxing, Muay Thai, kickboxing, Brazilian Jiu-Jitsu, wrestling, judo, karate and sambo. FRAME adapts its technical language and examples to your primary sport."
          }
        },
        {
          "@type": "Question",
          "name": "How does video analysis work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You upload training or sparring footage. Pose tracking runs on your own device, and every score in your FRAME REPORT is computed deterministically from measured movement — the AI writes only the narrative around those numbers, never the numbers themselves."
          }
        },
        {
          "@type": "Question",
          "name": "How much does FRAME cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "FRAME is free to start, including coaching conversations and a video analysis taster. FRAME+ is £6.99 per month and unlocks full video analysis history, the weekly mission, opponent scouting and the complete athlete model."
          }
        },
        {
          "@type": "Question",
          "name": "Is FRAME a replacement for my coach?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. FRAME is a layer on top of real training — it helps you understand your own patterns under pressure, prepares you between sessions and makes the coaching you already receive land better."
          }
        },
        {
          "@type": "Question",
          "name": "Can I use FRAME on my phone?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. FRAME is built mobile-first and can be installed on your phone like a native app directly from the browser."
          }
        }
      ]
    }
    </script>
