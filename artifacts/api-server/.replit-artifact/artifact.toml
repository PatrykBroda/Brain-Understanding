kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
# Run Drizzle migrations first so the production database schema is always
# up-to-date before the server binary starts.  The migrate script reads
# DATABASE_URL (injected by Replit's managed Postgres) and applies any
# unapplied migration files — including the idempotent DO-block in
# 0001_clerk_to_jwt_upgrade.sql.  If the schema is already current, the
# migrate step is a fast no-op.
args = ["sh", "-c", "pnpm --filter @workspace/db run migrate && pnpm --filter @workspace/api-server run build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# we don't run through pnpm to make startup faster in production
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
