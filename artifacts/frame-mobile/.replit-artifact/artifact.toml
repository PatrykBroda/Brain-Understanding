kind = "mobile"
previewPath = "/mobile/"
title = "FRAME Mobile"
version = "1.0.0"
id = "artifacts/frame-mobile"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
name = "expo"
paths = [ "/mobile/" ]
localPort = 8099

[services.development]
run = [ "node", "/home/runner/workspace/artifacts/frame-mobile/serve-static.mjs" ]

[services.production]
# The standalone FRAME Mobile app is retired: /mobile now 302-redirects to the
# full web app at "/". The service only runs serve-static.mjs (a redirector),
# so there is nothing to build — a no-op keeps a broken expo export from ever
# failing a deploy of a retired feature.
build = [ "true" ]
run = [ "pnpm", "--filter", "@workspace/frame-mobile", "run", "serve" ]

[services.env]
PORT = "8099"
BASE_PATH = "/mobile/"
