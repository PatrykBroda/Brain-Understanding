kind = "mobile"
previewPath = "/mobile/"
title = "FRAME Mobile"
version = "1.0.0"
id = "artifacts/frame-mobile"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
name = "expo"
paths = [ "/mobile/" ]
localPort = 8099

[services.development]
run = [ "node", "/home/runner/workspace/artifacts/frame-mobile/serve-static.mjs" ]

[services.production]
build = [ "pnpm", "--filter", "@workspace/frame-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/frame-mobile", "run", "serve" ]

[services.env]
PORT = "8099"
BASE_PATH = "/mobile/"
