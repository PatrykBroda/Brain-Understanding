kind = "mobile"
previewPath = "/mobile/"
title = "FRAME MMA AI"
version = "1.0.0"
id = "artifacts/frame-mobile"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
name = "expo"
paths = [ "/mobile/" ]
localPort = 8099

[services.development]
run = [ "pnpm", "--filter", "@workspace/frame-mobile", "run", "dev" ]

[services.production]
build = [ "pnpm", "--filter", "@workspace/frame-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/frame-mobile", "run", "serve" ]

[services.env]
PORT = "8099"
BASE_PATH = "/mobile/"
