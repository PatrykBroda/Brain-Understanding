openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /notifications:
    get:
      operationId: getNotifications
      summary: List the signed-in user's in-app notifications
      responses:
        "200":
          description: The newest 50 notifications and unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationInbox"
  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      summary: Mark one owned notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Notification marked read
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  id:
                    type: integer
                  readAt:
                    type: string
                    format: date-time
                required: [ok, id, readAt]
        "404":
          description: Notification not found
  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      summary: Mark all of the signed-in user's notifications as read
      responses:
        "200":
          description: Number of notifications marked read
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  updated:
                    type: integer
                required: [ok, updated]
  /billing/apple-price:
    get:
      operationId: getAppleSubscriptionPrice
      summary: Get Apple's current standard subscription price for an App Store storefront
      description: Authenticated. The product must belong to this app's Apple subscriptions. Returns 503 rather than guessing if Apple pricing cannot be verified.
      parameters:
        - name: productId
          in: query
          required: true
          schema:
            type: string
        - name: countryCode
          in: query
          required: true
          description: StoreKit storefront country code (ISO alpha-3); alpha-2 is accepted for older clients.
          schema:
            type: string
            pattern: "^[A-Z]{2,3}$"
      responses:
        "200":
          description: Current standard new-subscriber price from Apple
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppleSubscriptionPrice"
        "400":
          description: Invalid query
        "503":
          description: Price cannot be verified
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    NotificationInbox:
      type: object
      properties:
        unreadCount:
          type: integer
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
      required: [unreadCount, notifications]
    Notification:
      type: object
      properties:
        id:
          type: integer
        kind:
          type: string
        title:
          type: string
        body:
          type: string
        data:
          type: object
          additionalProperties:
            type: string
        createdAt:
          type: string
          format: date-time
        readAt:
          type: [string, "null"]
          format: date-time
      required: [id, kind, title, body, data, createdAt, readAt]
    AppleSubscriptionPrice:
      type: object
      properties:
        productId:
          type: string
        territory:
          type: string
          description: Storefront country code in the same form as the request.
        currencyCode:
          type: string
        localizedPrice:
          type: string
      required: [productId, territory, currencyCode, localizedPrice]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

